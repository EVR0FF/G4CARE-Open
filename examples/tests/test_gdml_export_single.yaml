# ── Тест: GDML-экспорт (single — один объём) ──
EVENTS: 1
VISUALIZATION: false

GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_AIR"
    DIMENSIONS: ["1*m", "1*m", "1*m"]
  OBJECTS:
    box_obj:
      name: "Box"
      shape: "box"
      material: "G4_WATER"
      DIMENSIONS: ["10*cm", "10*cm", "10*cm"]
      POSITION: [0, 0, 0]
      isSensitive: true
    sphere_obj:
      name: "Sphere"
      shape: "sphere"
      material: "G4_Al"
      DIMENSIONS: ["0*cm", "5*cm"]
      POSITION: [20*cm, 0, 0]
  EXPORT:
    ENABLE: true
    FILE: "/tmp/export_single.gdml"
    MODE: "single"
    VOLUME: "Box"

SOURCE:
  gun:
    type: "particleGun"
    particle: "e-"
    energy: "1*MeV"
    direction: { x: 0, y: 0, z: 1 }
    pos: { x: 0, y: 0, z: "-20*cm" }

PHYSICS:
  BASIC:
    LIST: "QGSP_BERT_EMV"
