# ── Тест: GDML-экспорт (scene — вся сцена) ──
EVENTS: 1
VISUALIZATION: false

GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_AIR"
    DIMENSIONS: ["1*m", "1*m", "1*m"]
  OBJECTS:
    box_obj:
      name: "Box"
      shape: "box"
      material: "G4_WATER"
      DIMENSIONS: ["10*cm", "10*cm", "10*cm"]
      POSITION: [0, 0, 0]
      isSensitive: true
  EXPORT:
    ENABLE: true
    FILE: "/tmp/export_scene.gdml"
    MODE: "scene"

SOURCE:
  gun:
    type: "particleGun"
    particle: "e-"
    energy: "1*MeV"
    direction: { x: 0, y: 0, z: 1 }
    pos: { x: 0, y: 0, z: "-20*cm" }

PHYSICS:
  BASIC:
    LIST: "QGSP_BERT_EMV"
