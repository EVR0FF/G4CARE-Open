# ── GAMMARAY_TELESCOPE: эталонный конфиг 1:1 ──
# TKR: 15 слоёв × 3 плоскости (Converter_W + DetectorY + DetectorX)
# Z-позиции как в GammaRayTelDetectorConstruction:
#   Converter:  -tkrSizeZ/2 + 2*tSi + dViews + convThick/2
#   DetectorY:  -tkrSizeZ/2 + tSi/2
#   DetectorX:  -tkrSizeZ/2 + tSi + dViews + tSi/2
# Пороги из GammaRayTelDigitizer: TKR=120keV, CAL=0, ACD=15keV

EVENTS: 300
VISUALIZATION: false
OUTPUT:
  file: "test_gammaray_telescope.root"
  streams:
    - name: "digits_cal"
      level: "digit"
      filter: { volumes: ["CAL"] }
      columns: [detector_name, digit_energy_MeV, digit_type]
    - name: "digits_tkr"
      level: "digit"
      filter: { volumes: ["TKRDetector"] }
      columns: [detector_name, digit_energy_MeV, digit_type]
    - name: "digits_acd"
      level: "digit"
      filter: { volumes: ["ACD"] }
      columns: [detector_name, digit_energy_MeV, digit_type]
    - name: "hits_tkr"
      level: "hit"
      filter: { volumes: ["TKRDetector"] }
      columns: [hit_edep_MeV, strip_number, plane_number, is_x_plane, pos_x, pos_y, pos_z]

GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_Galactic"
    DIMENSIONS: ["72*cm", "72*cm", "112*cm"]
  OBJECTS:
    payload:
      name: "Payload"
      shape: "box"
      material: "G4_Galactic"
      DIMENSIONS: ["48*cm", "48*cm", "74*cm"]
      POSITION: [0, 0, 0]

    calorimeter:
      name: "CAL"
      shape: "box"
      material: "G4_CESIUM_IODIDE"
      DIMENSIONS: ["36*cm", "36*cm", "15*cm"]
      POSITION: [0, 0, "-29.6*cm"]
      mother: "Payload"
      isSensitive: true
      DIGITIZE:
        calorimeter_mode: true
        threshold: 0
        digit_type: 1
        quantum_efficiency: 1.0

    tkr:
      name: "TKR"
      shape: "box"
      material: "G4_Galactic"
      DIMENSIONS: ["36*cm", "36*cm", "3*cm"]
      POSITION: [0, 0, "1.9*cm"]
      mother: "Payload"
      REPLICA:
        axis: "z"
        count: 15
        step: "3*cm"
        offset: 0
      CHILDREN:
        converter:
          name: "Converter"
          shape: "box"
          material: "G4_W"
          DIMENSIONS: ["36*cm", "36*cm", "0.03*cm"]
          POSITION: [0, 0, "-1.305*cm"]
        det_y:
          name: "TKRDetectorY"
          shape: "box"
          material: "G4_Si"
          DIMENSIONS: ["36*cm", "36*cm", "0.04*cm"]
          POSITION: [0, 0, "-1.48*cm"]
          isSensitive: true
          DIGITIZE:
            threshold: "120*keV"
            digit_type: 0
            quantum_efficiency: 1.0
        det_x:
          name: "TKRDetectorX"
          shape: "box"
          material: "G4_Si"
          DIMENSIONS: ["36*cm", "36*cm", "0.04*cm"]
          POSITION: [0, 0, "-1.34*cm"]
          isSensitive: true
          DIGITIZE:
            threshold: "120*keV"
            digit_type: 0
            quantum_efficiency: 1.0

    acd:
      name: "ACD"
      shape: "box"
      material: "G4_PLASTIC_SC_VINYLTOLUENE"
      DIMENSIONS: ["48*cm", "48*cm", "1*cm"]
      POSITION: [0, 0, "29.9*cm"]
      mother: "Payload"
      isSensitive: true
      DIGITIZE:
        threshold: "15*keV"
        digit_type: 2
        quantum_efficiency: 1.0

SOURCE_MODE: event

SOURCE:
  proton_source:
    type: "particleGun"
    particle: "proton"
    energy: "rand_uniform(1,10)*GeV"
    direction: { x: 0, y: 0, z: -1 }
    hemisphere: true
    vertex_radius: "25*cm"
    weight: 1
  gamma_source:
    type: "particleGun"
    particle: "gamma"
    energy: "rand_uniform(1,10)*GeV"
    direction: { x: 0, y: 0, z: -1 }
    hemisphere: true
    vertex_radius: "25*cm"
    weight: 1
  electron_source:
    type: "particleGun"
    particle: "e-"
    energy: "rand_uniform(1,10)*GeV"
    direction: { x: 0, y: 0, z: -1 }
    hemisphere: true
    vertex_radius: "25*cm"
    weight: 1


PHYSICS:
  BASIC:
    LIST: "QGSP_BERT_EMV"