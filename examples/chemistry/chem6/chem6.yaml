
NTHREADS: 8
OUTPUT_FILE: "chem6.root"
EVENTS: 15
VISUALIZATION: false
ENABLE_DICTIONARY: false
RUNACTION_VERBOSE: 1

GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_AIR"
    DIMENSIONS: ["1*m", "1*m", "1*m"]

  OBJECTS:
    target:
      name: "target"
      shape: "box"
      material: "G4_WATER"
      DIMENSIONS: ["50*cm", "50*cm", "50*cm"]
      POSITION: [0, 0, 0]
      isSensitive: true
      max_step_size: "0"

SOURCE_MODE: "flow"

SOURCE:
  e_source:
    type: "particleGun"
    particle: "e-"
    energy: "2.0*keV"
    direction:
      x: 0
      y: 0
      z: 1
    pos:
      x: 0
      y: 0
      z: 0

PHYSICS:
  BASIC:
    LIST: "FTFP_BERT"
  ADVANCED:
    EM_DNA:
      ENABLE: true
    EM_DNA_CHEM8:
      ENABLE: true

CHEMISTRY:
  ENABLE: true
  TIME_STEP_MODEL: "IRT"
  START_TIME: "1*ps"
  END_TIME: "1*us"
  SOLVATION_MODEL: "Meesungnoen2002"

  SPECIES:
    - "OH"
    - "H"
    - "e_aq"
    - "H3O"
    - "H2O2"
    - "H2"
    - "HO2"
    - "O2"
    - "OHm"

  RESET_REACTION_TABLE: true
  REACTION:
    "H + H -> H2":                   "0.503e10"
    "e_aq + H -> H2 + OHm":          "2.50e10"
    "e_aq + e_aq -> H2 + OHm + OHm": "0.636e10"
    "H3Op + OHm -> H2O":             "1.13e11"
    "·OH + H -> H2O":                "1.55e10"
    "·OH + ·OH -> H2O2":             "0.55e10"
    "e_aq + ·OH -> OHm":             "2.95e10"
    "e_aq + H2O2 -> OHm + ·OH":      "1.10e10"
    "e_aq + H3Op -> H + H2O":        "2.11e10"

  PRIMARY_KILLER:
    ENABLE: true
    ELOSS_MIN: "1.2*keV"
    ELOSS_MAX: "1.212*keV"
    SIZE: ["5*um", "5*um", "5*um"]

  G_VALUE:
    ENABLE: true
    N_OF_TIME_BINS: 50
    SPECIES:
      - "OH"
      - "e_aq"
      - "H"
      - "H3O"
      - "H2O2"
      - "H2"
      - "HO2"
      - "O2"
  VOLUME:
    -"target"

NTUPLES: ["g4care", "chem_tracks", "gfactor"]
NTUPLE:
  g4care:
    columns:
      - "particle_name"
      - "kinetic_energy"
      - "edep"
      - "volume_name"
      - "process_name"
  chem_tracks:
    columns:
      - "particle_name"
      - "x"
      - "y"
      - "z"
      - "volume_name"
  gfactor:
    columns:
      - "time_ps"
      - "species"
      - "G_value"
      - "G_value_err"
      - "mean_edep_eV"
      - "events"