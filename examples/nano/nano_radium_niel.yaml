# ── Источник: радиоактивный Ra-226 в водных слоях ──
SOURCE_MODE: "flow"

SOURCE:
  radium_water2:
    type: "radioactive"
    ISOTOPES:
      Ra226:
        name: "Ra226"
    object: "water2"

  radium_water3:
    type: "radioactive"
    ISOTOPES:
      Ra226:
        name: "Ra226"
    object: "water3"

# ── Физика: Radioactive Decay для распада Ra ──
PHYSICS:
  BASIC:
    LIST: "FTFP_BERT"
  ADVANCED:
    EM_OPTION4:
      ENABLE: true
    RDECAY:
      ENABLE: true

NTUPLES: ["g4care"]

NTUPLE:
  g4care:
    columns:
      - "particle_name"
      - "kinetic_energy"
      - "niel"
      - "dpa"
      - "edep"
      - "volume_name"
      - "process_name"
      - "x"
      - "y"
      - "z"