# ── Источник: электроны, спектр Клейна-Нишины (0.1-1.09 МэВ) ──
SOURCE_MODE: "flow"

SOURCE:
  e_punch:
    type: "particleGun"
    particle: "e-"
    energy: "rand_uniform(0.1, 1.09)*MeV"
    direction:
      x: 0
      y: 0
      z: 1
    pos:
      x: "rand_uniform(-1.5575, 1.5575)*nm"
      y: "rand_uniform(-2.706, 2.706)*nm"
      z: "-3.38*nm"

# ── Физика: ДНК-химия для G-фактора ──
PHYSICS:
  BASIC:
    LIST: "FTFP_BERT"
  ADVANCED:
    EM_DNA:
      ENABLE: true
    EM_DNA_CHEM8:
       ENABLE: true

# ── Химия ──
CHEMISTRY:
  ENABLE: true
  TIME_STEP_MODEL: "SBS"
  END_TIME: "1.001*ps"
  MAX_TIME_STEP: "0.001*ps"
  SPECIES:
    - "OH"
    - "H"
    - "e_aq"
    - "H3O"
    - "H2O2"
    - "H2"
    - "HO2"
    - "O2"
    - "OHm"
    - "O"
    - "O-"
    - "H20p"
  VOLUME:
    - "water1"
    - "water2"
    - "water3"
    - "water4"

NTUPLES: ["g4care", "chem_tracks"]

NTUPLE:
  g4care:
    columns:
      - "particle_name"
      - "kinetic_energy"
      - "edep"
      - "volume_name"
      - "x"
      - "y"
      - "z"
  chem_tracks:
    columns:
      - "particle_name"
      - "x"
      - "y"
      - "z"
      - "edep"
      - "volume_name"

EXPRS:
  - NAME: "ChemRefTest"
    VOLUME: ["water1", "water2", "water3", "water4"]
    SCRIPT: |
      g4cout('[SCORING] Chemistry @ t=', chem_end_ns, ' ns, edep=', chem_edep_eV, ' eV:');
      g4cout('  Species    N_created    N_at_end  charge');
      var total_q := 0;
      for (var i := 0; i < chem_n_species; i += 1) {
        var nCr := Nc[i];
        var nAt := Nt[i];
        var spQ := nAt * charge[i];
        total_q += spQ;
        g4cout('  ', species_name(i), ' ', nCr, ' ', nAt, ' ', spQ);
      }
      g4cout('[SCORING] TOTAL charge = ', total_q,
              if(abs(total_q) < 0.001, ' (NEUTRAL)', ' (VIOLATION!)'));
      var E_J := chem_edep_eV * 1.602176634e-19;
      var my_dose_Gy := if(volume_mass > 0, E_J / volume_mass, 0);
      g4cout('[SCORING] EDep=', chem_edep_eV, ' eV, mass=', volume_mass, ' kg, dose=', my_dose_Gy/1e6, ' MGy');

