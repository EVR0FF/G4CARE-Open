# ── Геометрия: box 40×40×31 nm + 7 слоёв внутри ──
GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_AIR"
    DIMENSIONS: ["20*cm", "20*cm", "30*cm"]
  OBJECTS:
    envelope:
      name: "envelope"
      shape: "tube"
      material: "AverageNanoTarget"
      DIMENSIONS: ["0*cm", "2.5*cm", "10*cm"]
      POSITION: [0, 0, 0]
      isSensitive: false
      max_step_size: "0"

    water1:
      name: "water1"
      shape: "box"
      material: "G4_WATER"
      mother: "envelope"
      DIMENSIONS: ["3.115*nm", "5.412*nm", "0.92*nm"]
      POSITION: [0, 0, "-3.38*nm"]
      isSensitive: true
      max_step_size: "0"
      cuts:
        e-: "1*eV"

    clay1:
      name: "clay1"
      shape: "box"
      material: "Clay1"
      mother: "envelope"
      DIMENSIONS: ["3.115*nm", "5.412*nm", "0.92*nm"]
      POSITION: [0, 0, "-2.46*nm"]
      isSensitive: false
      max_step_size: "0"

    water2:
