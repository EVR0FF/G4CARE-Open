# ── Источник: Particle Gun, гамма 1.3 МэВ ──
SOURCE_MODE: "flow"

SOURCE:
  gamma_gun:
    type: "particleGun"
    particle: "gamma"
    energy: "1.3*MeV"
    direction:
      x: 0
      y: 0
      z: 1
    pos:
      x: 0
      y: 0
      z: "-20*cm"

# ── Физика: ДНК-химия для G-фактора ──
PHYSICS:
  BASIC:
    LIST: "FTFP_BERT"
  ADVANCED:
     EM_DNA:
      ENABLE: true
     EM_DNA_CHEM8:
      ENABLE: true

# ── Химия ──
CHEMISTRY:
  ENABLE: true
  TIME_STEP_MODEL: "IRT"
  END_TIME: "1*ns"
  MAX_TIME_STEP: "1*ps"
  SPECIES:
    - "OH"
    - "H"
    - "e_aq"
    - "H3O"
    - "H2O2"
    - "H2"
    - "HO2"
    - "O2"
    - "OHm"
    - "O"
    - "O-"
  VOLUME:
    - "water1"
    - "water2"
    - "water3"
    - "water4"

NTUPLES: ["g4care"]

NTUPLE:
  g4care:
    columns:
      - "particle_name"
      - "kinetic_energy"
      - "edep"
  gfactor: