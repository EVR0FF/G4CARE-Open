# G4CARE configuration
EVENTS: 10
VISUALIZATION: false

GEOMETRY:
  WORLD:
    shape: "box"
    material: "G4_AIR"
    DIMENSIONS: ["1*m", "1*m", "1*m"]
  OBJECTS:
    target:
      name: "target"
      shape: "box"
      material: "G4_WATER"
      DIMENSIONS: ["10*cm", "10*cm", "10*cm"]
      POSITION: [0, 0, 0]
      isSensitive: true
    sphere:
      name: "sphere"
      shape: "sphere"
      material: "G4_Al"
      DIMENSIONS: ["0*cm", "5*cm"]
      POSITION: ["25*cm", 0, 0]

SOURCE:
  gun:
    type: "particleGun"
    particle: "e-"
    energy: "1*MeV"
    direction: { x: 0, y: 0, z: 1 }
    pos: { x: 0, y: 0, z: "-40*cm" }

PHYSICS:
  BASIC:
    LIST: "QGSP_BERT_EMV"
