server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the REST API to the backend service (docker-compose).
    location /artifacts {
        proxy_pass http://backend:3000;
    }
    location /auth {
        proxy_pass http://backend:3000;
    }
    location /health {
        proxy_pass http://backend:3000;
    }
    location /trash {
        proxy_pass http://backend:3000;
    }
    location /folders {
        proxy_pass http://backend:3000;
    }
    location /share {
        proxy_pass http://backend:3000;
    }
}
